spring.application.name=tradeOS
spring.config.import=optional:file:.env

spring.datasource.url=${DB_URL:jdbc:postgresql://tradeos-rajkumarpattnail-973d.h.aivencloud.com:25270/defaultdb?sslmode=require}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepaliveTime=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


twelvedata.api.key=${TWELVEDATA_API_KEY:}

# Poller intervals (ms) — increased to reduce Render memory pressure
tradeos.poller.symbol-refresh=30000
tradeos.poller.pricecache=30000
tradeos.poller.trademonitor=30000
tradeos.poller.algoengine=30000
news.api.key=${NEWS_API_KEY:}
jwt.secret=${JWT_SECRET:tradeossecretkeytradeossecretkey123456}
openrouter.api.key=${OPENROUTER_API_KEY:}
gold.api.key=${GOLD_API_KEY:}

server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s